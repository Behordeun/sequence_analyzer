services:
  - type: web
    name: sequence-analyzer
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      pip install uv && rm -rf .venv && uv venv && uv pip install ".[app]"
    startCommand: python -m streamlit run src/sequence_analyzer/app/pages/homepage.py --server.headless=true --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
