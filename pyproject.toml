[project]
name = "sequence-analyzer"
version = "0.2.0"
description = "Bioinformatics toolkit for DNA/RNA sequence analysis, alignment, and phylogenetics"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Muhammad Abiodun Sulaiman", email = "abiodun.msulaiman@gmail.com" },
    { name = "Bolaji Fatai Oyeyemi", email = "bolajioyeyemi@gmail.com" },
]
keywords = ["bioinformatics", "dna", "rna", "sequence-analysis", "alignment", "phylogenetics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "biopython>=1.83",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-bio>=0.6",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.37",
    "plotly>=5.22",
    "kaleido>=0.2",
    "matplotlib>=3.9",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "watchdog>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[project.scripts]
sequence-analyzer = "sequence_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/Behordeun/sequence_analyzer"
Repository = "https://github.com/Behordeun/sequence_analyzer"
Issues = "https://github.com/Behordeun/sequence_analyzer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sequence_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sequence_analyzer"]

[tool.mypy]
strict = true
packages = ["sequence_analyzer"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "Bio.*",
    "skbio.*",
    "sklearn.*",
    "plotly.*",
    "streamlit.*",
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "sequence_analyzer.core.*"
disallow_untyped_calls = false
warn_return_any = false
disable_error_code = ["union-attr", "arg-type", "index"]

[[tool.mypy.overrides]]
module = "sequence_analyzer.io.*"
disallow_untyped_calls = false
disable_error_code = ["union-attr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
